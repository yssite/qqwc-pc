[package]
name = "globalspeed"
version = "1.2.2"
description = "全球网测 桌面版 - CAICT speed test client"
authors = ["port"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["native-tls"] }
md-5 = "0.10"
des = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true





